<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        }

        body {
            background-color: #F5F6F5;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-y: auto;
            max-height: 100vh;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #005566;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            justify-items: center;
        }

        .tool-card {
            background: rgba(245, 246, 245, 0.7);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0, 89, 102, 0.3);
            width: 100%;
            max-width: 300px;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(0, 89, 102, 0.3);
        }

        .tool-card h3 {
            font-size: 18px;
            font-weight: 600;
            color: #005566;
        }

        @media (max-width: 414px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 28px;
            }

            .tool-grid {
                grid-template-columns: 1fr;
            }

            .tool-card {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Financial Tools</h1>
        <div class="tool-grid">
            <a href="dca-cal.html" class="tool-card">
                <h3>DCA Calculator</h3>
            </a>
            <a href="budget-planner.html" class="tool-card">
                <h3>Budget Planner</h3>
            </a>
            <a href="tax-estimator.html" class="tool-card">
                <h3>Income Tax Estimator</h3>
            </a>
            <a href="debt-repayment-cal.html" class="tool-card">
                <h3>Credit Card Payoff</h3>
            </a>
            <a href="compound-cal.html" class="tool-card">
                <h3>Compounding Wealth</h3>
            </a>
        </div>
    </div>
</body>
</html>
