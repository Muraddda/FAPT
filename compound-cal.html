<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <div class="container">

    <script>
        function calculateWealth() {
            const initialCapital = parseFloat(document.getElementById('initial-capital').value) || 0;
            const annualInvestment = parseFloat(document.getElementById('annual-investment').value) || 0;
            let roi = parseFloat(document.getElementById('roi').value) / 100 || 0;
            const years = parseInt(document.getElementById('investment-period').value) || 1;

            let futureValue = initialCapital;
            const monthlyROI = roi / 12;
            const months = years * 12;
            const monthlyContribution = annualInvestment / 12;

            for (let i = 0; i < months; i++) {
                futureValue = futureValue * (1 + monthlyROI) + monthlyContribution;
            }

            const totalInvested = initialCapital + annualInvestment * years;
            const totalROI = totalInvested > 0 ? ((futureValue - totalInvested) / totalInvested * 100) : 0;

            const formattedFutureValue = futureValue.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

            document.getElementById('future-wealth').textContent = `$${formattedFutureValue}`;
            document.getElementById('total-roi').textContent = `${totalROI.toFixed(2)}%`;

            document.getElementById('wealth-results').classList.add('active');
        }
    </script>
