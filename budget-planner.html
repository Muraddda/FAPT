<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        }

        body {
            background-color: #F5F6F5;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow-y: auto;
            max-height: 100vh;
        }

        .back-link {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 14px;
            font-weight: 500;
            color: #00897B;
            text-decoration: none;
            transition: color 0.3s;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        .back-link:hover {
            color: #005566;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #005566;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        h3 {
            font-size: 22px;
            font-weight: 600;
            color: #005566;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .section {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333333;
            letter-spacing: -0.01em;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 89, 102, 0.3);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(245, 246, 245, 0.7);
            transition: border-color 0.3s, background 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #005566;
            background: #FFFFFF;
        }

        .checkbox-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
            color: #333333;
        }

        .checkbox-label input {
            margin-right: 8px;
        }

        .clear-all {
            padding: 8px 12px;
            background: linear-gradient(180deg, #FF4D4F 0%, #D9363E 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: auto;
            min-width: 80px;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        .clear-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3);
        }

        .clear-all:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .subcategory {
            display: none;
            margin-top: 8px;
            margin-left: 16px;
        }

        .subcategory.active {
            display: block;
        }

        .subcategory label {
            margin-top: 8px;
        }

        .subcategory input {
            margin-bottom: 8px;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #005566 0%, #004B58 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 24px;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 89, 102, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .results {
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .results.active {
            display: block;
        }

        .toggle-view {
            display: block;
            width: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #00897B 0%, #006B5F 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 16px;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        .toggle-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 137, 123, 0.3);
        }

        .toggle-view:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .result-metrics {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .metric {
            flex: 1;
            text-align: center;
        }

        .metric p {
            font-size: 36px;
            font-weight: 700;
            color: #00897B;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .metric span {
            font-size: 15px;
            font-weight: 500;
            color: #333333;
            letter-spacing: -0.01em;
        }

        #budget-chart-container {
            display: none;
            max-width: 400px;
            margin: 0 auto;
        }

        #budget-chart-container.active {
            display: block;
        }

        @media (max-width: 414px) {
            .container {
                padding: 24px;
            }

            h2 {
                font-size: 24px;
            }

            h3 {
                font-size: 20px;
            }

            .result-metrics {
                flex-direction: column;
                gap: 12px;
            }

            .metric p {
                font-size: 28px;
            }

            button, .toggle-view {
                font-size: 16px;
                padding: 12px;
            }

            .clear-all {
                padding: 8px 10px;
                font-size: 14px;
            }

            input[type="number"] {
                padding: 10px 12px;
                font-size: 14px;
            }

            .back-link {
                font-size: 12px;
                top: 12px;
                left: 12px;
            }

            #budget-chart-container {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">Back to Home</a>
        <div class="tab-content active" id="budget-planner">
            <h2>Budget Planner</h2>
            <div class="section">
                <label>Monthly Take-Home Income ($)</label>
                <input type="number" id="monthly-income" min="0" step="0.01">
            </div>
            <div class="section">
                <div class="checkbox-container">
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-subcategories" onclick="toggleSubcategories()">
                        <span>Show Detailed Subcategories</span>
                    </div>
                    <button class="clear-all" onclick="clearBudgetPlanner()">Clear All</button>
                </div>
            </div>
            <div class="section">
                <h3>Essential Expenses</h3>
                <div>
                    <label>Housing ($)</label>
                    <input type="number" class="category-total" data-category="housing" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Rent/Mortgage</label><input type="number" class="subcategory-input" data-category="housing" min="0" step="0.01">
                        <label>Property Taxes</label><input type="number" class="subcategory-input" data-category="housing" min="0" step="0.01">
                        <label>Home Insurance</label><input type="number" class="subcategory-input" data-category="housing" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Utilities ($)</label>
                    <input type="number" class="category-total" data-category="utilities" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Electricity</label><input type="number" class="subcategory-input" data-category="utilities" min="0" step="0.01">
                        <label>Water</label><input type="number" class="subcategory-input" data-category="utilities" min="0" step="0.01">
                        <label>Phone/Internet</label><input type="number" class="subcategory-input" data-category="utilities" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Transportation ($)</label>
                    <input type="number" class="category-total" data-category="transportation" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Car Payment</label><input type="number" class="subcategory-input" data-category="transportation" min="0" step="0.01">
                        <label>Auto Insurance</label><input type="number" class="subcategory-input" data-category="transportation" min="0" step="0.01">
                        <label>Fuel</label><input type="number" class="subcategory-input" data-category="transportation" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Groceries ($)</label>
                    <input type="number" class="category-total" data-category="groceries" min="0" step="0.01">
                </div>
                <div>
                    <label>Healthcare ($)</label>
                    <input type="number" class="category-total" data-category="healthcare" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Health Insurance</label><input type="number" class="subcategory-input" data-category="healthcare" min="0" step="0.01">
                        <label>Prescriptions</label><input type="number" class="subcategory-input" data-category="healthcare" min="0" step="0.01">
                        <label>Co-Pays</label><input type="number" class="subcategory-input" data-category="healthcare" min="0" step="0.01">
                    </div>
                </div>
            </div>
            <div class="section">
                <h3>Lifestyle Expenses</h3>
                <div>
                    <label>Personal Care ($)</label>
                    <input type="number" class="category-total" data-category="personal-care" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Clothing</label><input type="number" class="subcategory-input" data-category="personal-care" min="0" step="0.01">
                        <label>Haircuts</label><input type="number" class="subcategory-input" data-category="personal-care" min="0" step="0.01">
                        <label>Toiletries</label><input type="number" class="subcategory-input" data-category="personal-care" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Subscriptions ($)</label>
                    <input type="number" class="category-total" data-category="subscriptions" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Streaming Services</label><input type="number" class="subcategory-input" data-category="subscriptions" min="0" step="0.01">
                        <label>Software</label><input type="number" class="subcategory-input" data-category="subscriptions" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Fitness & Wellness ($)</label>
                    <input type="number" class="category-total" data-category="fitness" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Gym Membership</label><input type="number" class="subcategory-input" data-category="fitness" min="0" step="0.01">
                        <label>Wellness Activities</label><input type="number" class="subcategory-input" data-category="fitness" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Entertainment & Social ($)</label>
                    <input type="number" class="category-total" data-category="entertainment" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Dining Out</label><input type="number" class="subcategory-input" data-category="entertainment" min="0" step="0.01">
                        <label>Hobbies/Travel</label><input type="number" class="subcategory-input" data-category="entertainment" min="0" step="0.01">
                    </div>
                </div>
            </div>
            <div class="section">
                <h3>Financial Priorities</h3>
                <div>
                    <label>Debt Repayment ($)</label>
                    <input type="number" class="category-total" data-category="debt" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Student Loans</label><input type="number" class="subcategory-input" data-category="debt" min="0" step="0.01">
                        <label>Credit Cards</label><input type="number" class="subcategory-input" data-category="debt" min="0" step="0.01">
                    </div>
                </div>
                <div>
                    <label>Savings & Investments ($)</label>
                    <input type="number" class="category-total" data-category="savings" min="0" step="0.01">
                    <div class="subcategory">
                        <label>Retirement Accounts</label><input type="number" class="subcategory-input" data-category="savings" min="0" step="0.01">
                        <label>Education Savings</label><input type="number" class="subcategory-input" data-category="savings" min="0" step="0.01">
                        <label>Health Savings Accounts</label><input type="number" class="subcategory-input" data-category="savings" min="0" step="0.01">
                        <label>Emergency Funds</label><input type="number" class="subcategory-input" data-category="savings" min="0" step="0.01">
                    </div>
                </div>
            </div>
            <div class="section results" id="budget-results">
                <h3>Budget Summary</h3>
                <button class="toggle-view" onclick="toggleBudgetView()">Show Pie Chart</button>
                <div id="budget-metrics">
                    <div class="result-metrics">
                        <div class="metric">
                            <p id="essential-total">$0.00</p>
                            <span>Essential Expenses</span>
                        </div>
                        <div class="metric">
                            <p id="lifestyle-total">$0.00</p>
                            <span>Lifestyle Expenses</span>
                        </div>
                        <div class="metric">
                            <p id="financial-total">$0.00</p>
                            <span>Financial Priorities</span>
                        </div>
                    </div>
                    <div class="result-metrics">
                        <div class="metric">
                            <p id="total-expenses">$0.00</p>
                            <span>Total Expenses</span>
                        </div>
                        <div class="metric">
                            <p id="disposable-income">$0.00</p>
                            <span>Disposable Income</span>
                        </div>
                    </div>
                </div>
                <div id="budget-chart-container">
                    <canvas id="budget-chart"></canvas>
                </div>
            </div>
            <button onclick="calculateBudget()">Calculate Budget</button>
        </div>
    </div>
    <script>
        let budgetChart = null;
        let isChartView = false;

        Chart.register(ChartDataLabels);

        function toggleSubcategories() {
            const isChecked = document.getElementById('show-subcategories').checked;
            document.querySelectorAll('.subcategory').forEach(sub => sub.classList.toggle('active', isChecked));
            if (isChecked) {
                updateCategoryTotals();
            }
        }

        function updateCategoryTotals() {
            const categories = ['housing', 'utilities', 'transportation', 'healthcare', 'personal-care', 'subscriptions', 'fitness', 'entertainment', 'debt', 'savings'];
            categories.forEach(category => {
                const inputs = document.querySelectorAll(`.subcategory-input[data-category="${category}"]`);
                let total = 0;
                inputs.forEach(input => {
                    total += parseFloat(input.value) || 0;
                });
                const categoryTotalInput = document.querySelector(`.category-total[data-category="${category}"]`);
                if (categoryTotalInput) {
                    categoryTotalInput.value = total.toFixed(2);
                }
            });
        }

        function calculateBudget() {
            let essentialTotal = 0;
            let lifestyleTotal = 0;
            let financialTotal = 0;

            const showSubcategories = document.getElementById('show-subcategories').checked;

            if (showSubcategories) {
                document.querySelectorAll('.subcategory-input').forEach(input => {
                    const value = parseFloat(input.value) || 0;
                    const category = input.dataset.category;
                    if (['housing', 'utilities', 'transportation', 'healthcare'].includes(category)) {
                        essentialTotal += value;
                    } else if (['personal-care', 'subscriptions', 'fitness', 'entertainment'].includes(category)) {
                        lifestyleTotal += value;
                    } else if (['debt', 'savings'].includes(category)) {
                        financialTotal += value;
                    }
                });
                updateCategoryTotals();
            } else {
                document.querySelectorAll('.category-total').forEach(input => {
                    const value = parseFloat(input.value) || 0;
                    const category = input.dataset.category;
                    if (['housing', 'utilities', 'transportation', 'groceries', 'healthcare'].includes(category)) {
                        essentialTotal += value;
                    } else if (['personal-care', 'subscriptions', 'fitness', 'entertainment'].includes(category)) {
                        lifestyleTotal += value;
                    } else if (['debt', 'savings'].includes(category)) {
                        financialTotal += value;
                    }
                });
            }

            const totalExpenses = essentialTotal + lifestyleTotal + financialTotal;
            const income = parseFloat(document.getElementById('monthly-income').value) || 0;
            const disposableIncome = Math.max(0, income - totalExpenses);

            document.getElementById('essential-total').textContent = `$${essentialTotal.toFixed(2)}`;
            document.getElementById('lifestyle-total').textContent = `$${lifestyleTotal.toFixed(2)}`;
            document.getElementById('financial-total').textContent = `$${financialTotal.toFixed(2)}`;
            document.getElementById('total-expenses').textContent = `$${totalExpenses.toFixed(2)}`;
            document.getElementById('disposable-income').textContent = `$${disposableIncome.toFixed(2)}`;

            document.getElementById('budget-results').classList.add('active');

            updatePieChart(essentialTotal, lifestyleTotal, financialTotal, disposableIncome, income);
        }

        function updatePieChart(essential, lifestyle, financial, disposable, income) {
            const data = [essential, lifestyle, financial, disposable];
            const labels = ['Essential Expenses', 'Lifestyle Expenses', 'Financial Priorities', 'Disposable Income'];
            const percentages = data.map(value => income > 0 ? ((value / income) * 100).toFixed(1) : 0);

            if (budgetChart) {
                budgetChart.destroy();
            }

            const ctx = document.getElementById('budget-chart').getContext('2d');
            budgetChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#00C4B4', '#FF4560', '#775DD0', '#D3D3D3'],
                        borderColor: '#FFFFFF',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: {
                                    size: 14,
                                    family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif'
                                },
                                color: '#333333'
                            }
                        },
                        tooltip: {
                            enabled: false
                        },
                        datalabels: {
                            color: '#FFFFFF',
                            textAlign: 'center',
                            font: {
                                size: 12,
                                weight: 'bold',
                                family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif'
                            },
                            formatter: (value, context) => {
                                const percentage = percentages[context.dataIndex];
                                return `$${value.toFixed(2)}\n${percentage}%`;
                            },
                            textStrokeColor: '#333333',
                            textStrokeWidth: 0.5,
                            padding: 4
                        }
                    }
                }
            });
        }

        function toggleBudgetView() {
            isChartView = !isChartView;
            const metrics = document.getElementById('budget-metrics');
            const chartContainer = document.getElementById('budget-chart-container');
            const toggleButton = document.querySelector('.toggle-view');

            if (isChartView) {
                metrics.style.display = 'none';
                chartContainer.classList.add('active');
                toggleButton.textContent = 'Show Summary Table';
            } else {
                metrics.style.display = 'block';
                chartContainer.classList.remove('active');
                toggleButton.textContent = 'Show Pie Chart';
            }
        }

        function clearBudgetPlanner() {
            document.querySelectorAll('#budget-planner input[type="number"]').forEach(input => input.value = '');
            document.getElementById('show-subcategories').checked = false;
            toggleSubcategories();
            document.getElementById('essential-total').textContent = '$0.00';
            document.getElementById('lifestyle-total').textContent = '$0.00';
            document.getElementById('financial-total').textContent = '$0.00';
            document.getElementById('total-expenses').textContent = '$0.00';
            document.getElementById('disposable-income').textContent = '$0.00';
            document.getElementById('budget-results').classList.remove('active');
            if (budgetChart) {
                budgetChart.destroy();
                budgetChart = null;
            }
            isChartView = false;
            document.querySelector('.toggle-view').textContent = 'Show Pie Chart';
        }
    </script>
</body>
</html>
