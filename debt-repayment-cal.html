<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Payoff Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        }

        body {
            background-color: #F5F6F5;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow-y: auto;
            max-height: 100vh;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #00897B;
            text-decoration: none;
            transition: color 0.3s;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        .back-link:hover {
            color: #005566;
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            color: #005566;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        h3 {
            font-size: 22px;
            font-weight: 600;
            color: #005566;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .section {
            margin-bottom: 24px;
        }

        .card-list > div {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .card-list input, .card-list button {
            flex: 1;
            min-width: 120px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333333;
            letter-spacing: -0.01em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 89, 102, 0.3);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(245, 246, 245, 0.7);
            transition: border-color 0.3s, background 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #005566;
            background: #FFFFFF;
        }

        .card-list button {
            padding: 8px 12px;
            background: linear-gradient(180deg, #FF4D4F 0%, #D9363E 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: auto;
            min-width: 80px;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        .card-list button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 77, 79, 0.3);
        }

        .card-list button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #005566 0%, #004B58 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 24px;
            min-height: 44px;
            line-height: 44px;
            touch-action: manipulation;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 89, 102, 0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .results {
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .results.active {
            display: block;
        }

        #payoff-details {
            text-align: left;
            font-size: 15px;
            color: #333333;
            margin-top: 16px;
        }

        @media (max-width: 414px) {
            .container {
                padding: 24px;
            }

            h2 {
                font-size: 24px;
            }

            h3 {
                font-size: 20px;
            }

            .card-list > div {
                flex-direction: column;
            }

            .card-list input, .card-list button {
                min-width: 100%;
            }

            button {
                font-size: 16px;
                padding: 12px;
            }

            .card-list button {
                padding: 8px 10px;
                font-size: 14px;
            }

            input[type="text"], input[type="number"] {
                padding: 10px 12px;
                font-size: 14px;
            }
        }

        .field-error {
            color: #D9363E;
            font-size: 13px;
            line-height: 1.3;
            margin: 4px 0 0 0;
            overflow-wrap: anywhere;
        }

        .field-error:empty {
            display: none;
        }

        .card-list .field {
            flex: 1;
            min-width: 120px;
            max-width: 100%;
        }

        .card-names,
        .savings-line,
        .estimate-note {
            overflow-wrap: anywhere;
        }

        .card-names {
            margin-bottom: 12px;
        }

        .strategy-compare {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .strategy-result {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(0, 89, 102, 0.25);
            border-radius: 12px;
            padding: 12px;
            background: rgba(245, 246, 245, 0.7);
        }

        .strategy-result.is-cheaper {
            border: 2px solid #00897B;
            background: rgba(0, 137, 123, 0.12);
        }

        .strategy-result h3 {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .strategy-description {
            font-size: 14px;
            color: #555555;
        }

        .strategy-result p {
            margin: 0 0 6px 0;
            overflow-wrap: anywhere;
        }

        .strategy-result p:last-child {
            margin-bottom: 0;
        }

        .savings-line {
            margin-top: 14px;
            font-weight: 600;
            color: #005566;
            text-align: center;
        }

        .estimate-note {
            margin-top: 8px;
            font-size: 13px;
            color: #555555;
            text-align: center;
        }

        .payoff-message {
            margin-top: 8px;
        }

        @media (max-width: 414px) {
            .card-list > div {
                align-items: stretch;
            }

            .card-list .field {
                min-width: 0;
                max-width: 100%;
            }

            .strategy-compare {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">Back to Home</a>
        <div class="tab-content" id="debt-payoff">
            <h2>Credit Card Payoff Calculator</h2>
            <div class="section card-list" id="card-list">
                <div class="card-row">
                    <div class="field">
                        <label for="card-name-1">Card Name</label>
                        <input type="text" id="card-name-1" placeholder="Card Name" class="card-name">
                        <p class="field-error" id="card-name-1-error"></p>
                    </div>
                    <div class="field">
                        <label for="card-balance-1">Balance ($)</label>
                        <input type="text" id="card-balance-1" inputmode="decimal" placeholder="Balance ($)" class="card-balance">
                        <p class="field-error" id="card-balance-1-error"></p>
                    </div>
                    <div class="field">
                        <label for="card-apr-1">APR (%)</label>
                        <input type="text" id="card-apr-1" inputmode="decimal" placeholder="APR (%)" class="card-apr">
                        <p class="field-error" id="card-apr-1-error"></p>
                    </div>
                    <div class="field">
                        <label for="card-min-payment-1">Minimum Payment ($)</label>
                        <input type="text" id="card-min-payment-1" inputmode="decimal" placeholder="Minimum Payment ($)" class="card-min-payment">
                        <p class="field-error" id="card-min-payment-1-error"></p>
                    </div>
                    <button type="button" class="remove-card">Remove</button>
                </div>
                <p class="field-error" id="cards-error"></p>
            </div>
            <button type="button" id="add-card">Add a Card</button>
            <div class="section">
                <label for="monthly-budget">Monthly Budget ($)</label>
                <div class="field">
                    <input type="text" inputmode="decimal" id="monthly-budget">
                    <p class="field-error" id="monthly-budget-error"></p>
                </div>
            </div>
            <button type="button" id="calculate">Calculate</button>
            <div class="section results" id="payoff-summary">
                <h3>Payoff Summary</h3>
                <div id="payoff-details">
                    Payoff summary will appear here.
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
