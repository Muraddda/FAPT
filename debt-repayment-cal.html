<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>
    <div class="container">
        <a href="index.html" class="back-link">Back to Home</a>
        <div class="tab-content" id="debt-payoff">
            <h2>Credit Card Payoff Calculator</h2>
            <div class="section card-list" id="card-list">
                <div>
                    <input type="text" placeholder="Card Name">
                    <input type="number" placeholder="Balance ($)" min="0" step="0.01" class="card-balance">
                    <input type="number" placeholder="APR (%)" min="0" step="0.01" class="card-apr">
                    <input type="number" placeholder="Minimum Payment ($)" min="0" step="0.01" class="card-min-payment">
                    <button onclick="removeCard(this)">Remove</button>
                </div>
            </div>
            <button onclick="addCard()">Add a Card</button>
            <div class="section">
                <label>Monthly Budget ($)</label>
                <input type="number" id="monthly-budget" min="0" step="0.01">
            </div>
            <button onclick="calculatePayoff()">Calculate</button>
            <div class="section results" id="payoff-summary">
                <h3>Payoff Summary</h3>
                <div id="payoff-details">
                    Payoff summary will appear here.
                </div>
                <div class="download-buttons">
                    <button onclick="downloadSummary('complete')">Download Complete Summary</button>
                    <button onclick="downloadSummary('simplified')">Download Simplified Summary</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function clearDebtPayoff() {
            const cardList = document.getElementById('card-list');
            cardList.innerHTML = `
                <div>
                    <input type="text" placeholder="Card Name">
                    <input type="number" placeholder="Balance ($)" min="0" step="0.01" class="card-balance">
                    <input type="number" placeholder="APR (%)" min="0" step="0.01" class="card-apr">
                    <input type="number" placeholder="Minimum Payment ($)" min="0" step="0.01" class="card-min-payment">
                    <button onclick="removeCard(this)">Remove</button>
                </div>
            `;
            document.getElementById('monthly-budget').value = '';
            document.getElementById('payoff-summary').classList.remove('active');
            document.getElementById('payoff-details').innerHTML = 'Payoff summary will appear here.';
        }

        function addCard() {
            const cardList = document.getElementById('card-list');
            const card = document.createElement('div');
            card.innerHTML = `
                <input type="text" placeholder="Card Name">
                <input type="number" placeholder="Balance ($)" min="0" step="0.01" class="card-balance">
                <input type="number" placeholder="APR (%)" min="0" step="0.01" class="card-apr">
                <input type="number" placeholder="Minimum Payment ($)" min="0" step="0.01" class="card-min-payment">
                <button onclick="removeCard(this)">Remove</button>
            `;
            cardList.appendChild(card);
        }

        function removeCard(button) {
            const cardList = document.getElementById('card-list');
            if (cardList.children.length > 1) {
                button.parentElement.remove();
            }
        }

        function calculatePayoff() {
            const monthlyBudget = parseFloat(document.getElementById('monthly-budget').value) || 0;
            const cards = Array.from(document.querySelectorAll('#card-list > div')).map(div => ({
                name: div.children[0].value || 'Card',
                balance: parseFloat(div.children[1].value) || 0,
                apr: parseFloat(div.children[2].value) || 0,
                minPayment: parseFloat(div.children[3].value) || 0
            }));

            cards.sort((a, b) => a.balance - b.balance);

            let remainingBudget = monthlyBudget;
            let months = 0;
            let summary = '';
            const debts = [...cards];

            while (debts.length > 0 && remainingBudget > 0) {
                let totalMinPayments = debts.reduce((sum, debt) => sum + debt.minPayment, 0);
                if (remainingBudget < totalMinPayments) {
                    summary += '<p>Monthly budget insufficient for minimum payments.</p>';
                    break;
                }
                let extra = remainingBudget - totalMinPayments;
                debts[0].balance -= (debts[0].minPayment + extra);
                if (debts[0].balance <= 0) {
                    summary += `<p>${debts[0].name} paid off in month ${months + 1} .</p>`;
                    debts.shift();
                } else {
                    debts[0].balance += debts[0].balance * (debts[0].apr / 100 / 12);
                }
                months++;
                if (months > 1200) break;
            }

            document.getElementById('payoff-details').innerHTML = summary || 'All debts paid off!';
            document.getElementById('payoff-summary').classList.add('active');

            window.completeSummary = summary.replace(/<[^>]+>/g, '\n').trim();
            window.simplifiedSummary = summary.replace(/<[^>]+>/g, '\n').trim();
        }

        function downloadSummary(type) {
            const content = type === 'complete' ? window.completeSummary : window.simplifiedSummary;
            if (!content) {
                alert('Please calculate the payoff first.');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `credit_card_payoff_${type}_summary.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
