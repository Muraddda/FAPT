<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

        function toggleAdvancedOptions() {

        function clearTaxEstimator() {
            document.querySelectorAll('#tax-estimator input[type="number"]').forEach(input => input.value = '');
            document.getElementById('filing-status').value = 'single';
            document.getElementById('tax-year').value = '2025';
            document.getElementById('state-residence').value = '';
            document.getElementById('show-advanced').checked = false;
            toggleAdvancedOptions();
            document.getElementById('federal-tax').textContent = '$0.00';
            document.getElementById('state-tax').textContent = '$0.00';
            document.getElementById('total-tax').textContent = '$0.00';
            document.getElementById('tax-results').classList.remove('active');
        }

        function estimateTax() {
            // Placeholder: Real implementation would calculate taxes
            const income = parseFloat(document.getElementById('total-income').value) || 0;
            const federalTax = income * 0.2; // Mock federal tax rate
            const stateTax = income * 0.05; // Mock state tax rate
            const totalTax = federalTax + stateTax;

            document.getElementById('federal-tax').textContent = `$${federalTax.toFixed(2)}`;
            document.getElementById('state-tax').textContent = `$${stateTax.toFixed(2)}`;
